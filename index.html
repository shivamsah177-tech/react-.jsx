<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Warehouse Splitter - Control Panel</title>
  <!-- Google Fonts: Outfit (Headings) and Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Atmospheric background glow blobs -->
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>
  <div class="glow-blob blob-3"></div>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-title">Splitter</span>
          <span class="brand-subtitle">Warehouse SaaS</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <li>
            <button class="nav-btn active" id="nav-dashboard" data-tab="dashboard">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-inventory" data-tab="inventory">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>Master Inventory</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-orders" data-tab="orders">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              <span>Order Line-Up</span>
              <span class="badge" id="order-badge">0</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-barcode" data-tab="barcode">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="5" x2="3" y2="19"></line><line x1="8" y1="5" x2="8" y2="19"></line><line x1="12" y1="5" x2="12" y2="19"></line><line x1="16" y1="5" x2="16" y2="19"></line><line x1="21" y1="5" x2="21" y2="19"></line></svg>
              <span>Barcode Finder</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-logistics" data-tab="logistics">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              <span>Logistics & Route</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-suppliers" data-tab="suppliers">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Supplier Rules</span>
            </button>
          </li>
          <li>
            <button class="nav-btn" id="nav-history" data-tab="history">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span>Change History</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">SM</div>
          <div class="user-details">
            <span class="user-name">Manager Account</span>
            <span class="user-role">Warehouse Admin</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-search">
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="topbar-barcode-search" placeholder="Quick Barcode Search (e.g. 789012345601)...">
          </div>
        </div>

        <div class="topbar-actions">
          <div class="clock-display" id="system-clock">00:00:00</div>
          
          <div class="notifications-bell">
            <div class="bell-icon-wrapper">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span class="bell-badge" id="notification-badge">0</span>
            </div>
            <!-- Notification dropdown -->
            <div class="notifications-dropdown" id="notifications-panel">
              <div class="notifications-header">
                <h3>Notifications</h3>
                <button id="clear-notifications">Clear All</button>
              </div>
              <div class="notifications-list" id="notifications-list">
                <div class="empty-notifications">No new messages</div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Active view injection target -->
      <section class="view-viewport" id="active-view-container">
        <!-- Rendered view injected here by app.js -->
      </section>
    </main>
  </div>

  <!-- Toast notification system -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
